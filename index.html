<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sprintpad</title>
    <meta name="description" content="A keyboard-first focus notepad." />
    <meta name="theme-color" content="#1c1a17" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <!--
      GoatCounter. No cookies, and nothing from the document is sent. Pad names
      live in the path (/happy), so the path is flattened to "/" before it is
      counted — a pad name is half of what opens it and has no business in an
      analytics dashboard. Localhost and private networks are ignored by
      count.js, so development is not counted.
    -->
    <script>
      window.goatcounter = { path: () => "/" };
    </script>
    <script
      data-goatcounter="https://sprintpad.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
